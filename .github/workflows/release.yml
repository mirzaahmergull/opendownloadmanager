name: Release source
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated version tag (vX.Y.Z)
        required: true
        type: string
      publish:
        description: Publish after validation (default creates a draft)
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate tag and version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node -e "const p=require('./package.json'),e=require('./extension/manifest.json');if(process.env.RELEASE_TAG!=='v'+p.version||e.version!==p.version)throw Error('Tag/app/extension versions must match')"
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
      - run: npm ci --ignore-scripts
      - run: npm run release:assets
      - name: Validate public asset boundaries
        run: |
          python3 - <<'PY'
          import zipfile, pathlib
          for path in pathlib.Path('release').glob('*.zip'):
              with zipfile.ZipFile(path) as z:
                  assert z.testzip() is None
                  assert not any(n.endswith(('.exe','.dll','.dylib','.pem','.key')) or '/node_modules/' in n or '/credentials.json' in n or '/state.json' in n for n in z.namelist())
          PY
      - name: Create draft with GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          printf '%s\n' 'Application source and unpacked Chrome/Edge extension. Original source is MIT; third-party programs retain their licenses.' '' 'Desktop packages are pending redistribution work in RELEASING.md. See CHANGELOG.md and VERIFICATION.md for features, tests and limits.' > release/notes.md
          gh release create "$RELEASE_TAG" release/*Source.zip release/*Extension.zip release/SHA256SUMS.txt --verify-tag --draft --title "Open Download Manager ${RELEASE_TAG}" --notes-file release/notes.md
      - name: Publish when explicitly selected
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false
